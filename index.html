
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SANMAR LICENSES</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1f3a5f;
            margin: 0 0 35px;
        }

        .table-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: #1f3a5f;
            color: #ffffff;
        }

        th {
            padding: 16px 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 18px 20px;
            font-size: 16px;
            border-bottom: 1px solid #e8edf2;
        }

        tbody tr:hover {
            background: #f5f8fc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .empresa {
            font-weight: 600;
            color: #263b53;
        }

        .estado {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .activo {
            background: #e3f7e9;
            color: #218344;
        }

        .inactivo {
            background: #fde8e8;
            color: #b42318;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #b42318;
        }

        .actualizacion {
            margin-top: 18px;
            color: #8793a3;
            font-size: 12px;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #8793a3;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 12px;
            }

            h1 {
                font-size: 27px;
                letter-spacing: 1px;
            }

            .table-container {
                padding: 12px;
            }

            th, td {
                padding: 14px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>SANMAR LICENSES</h1>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody id="empresas">
                    <tr>
                        <td colspan="2" style="text-align:center">
                            Cargando licencias...
                        </td>
                    </tr>
                </tbody>
            </table>

            <div id="mensaje" class="error" hidden>
                No fue posible cargar la información de las licencias.
                Verifica que los archivos JSON existan y sean válidos.
            </div>

            <div id="actualizacion" class="actualizacion"></div>
        </div>

        <footer>
            &copy; 2026 SANMAR LICENSES
        </footer>

    </div>

    
<script>
    async function cargarLicencias() {
        const tabla = document.getElementById("empresas");
        const mensaje = document.getElementById("mensaje");
        const actualizacion = document.getElementById("actualizacion");

        try {
            const indiceUrl = "./licenses.json?v=" + Date.now();

            const respuestaIndice = await fetch(indiceUrl, {
                cache: "no-store"
            });

            if (!respuestaIndice.ok) {
                throw new Error("No se pudo cargar licenses.json");
            }

            const archivos = await respuestaIndice.json();

            if (!Array.isArray(archivos)) {
                throw new Error("El índice de licencias no es válido");
            }

            const licencias = await Promise.all(
                archivos.map(async archivo => {
                    // Solo aceptar nombres de archivos JSON sencillos.
                    if (
                        typeof archivo !== "string" ||
                        !/^[a-zA-Z0-9_-]+\.json$/.test(archivo) ||
                        archivo === "licenses.json"
                    ) {
                        throw new Error("Nombre de archivo no válido");
                    }

                    const respuesta = await fetch(
                        "./" + archivo + "?v=" + Date.now(),
                        { cache: "no-store" }
                    );

                    if (!respuesta.ok) {
                        throw new Error("Error al cargar " + archivo);
                    }

                    const licencia = await respuesta.json();

                    if (
                        typeof licencia.operator !== "string" ||
                        typeof licencia.enabled !== "boolean"
                    ) {
                        throw new Error("JSON no válido: " + archivo);
                    }

                    return licencia;
                })
            );

            tabla.replaceChildren();

            licencias.forEach(licencia => {
                const fila = document.createElement("tr");
                const empresa = document.createElement("td");
                const celdaEstado = document.createElement("td");
                const etiqueta = document.createElement("span");

                empresa.className = "empresa";
                empresa.textContent = licencia.operator.toUpperCase();

                etiqueta.className = licencia.enabled
                    ? "estado activo"
                    : "estado inactivo";

                etiqueta.textContent = String(licencia.enabled);

                celdaEstado.appendChild(etiqueta);
                fila.append(empresa, celdaEstado);
                tabla.appendChild(fila);
            });

            mensaje.hidden = true;
            actualizacion.textContent =
                "Información consultada: " +
                new Date().toLocaleString("es-CO");

        } catch (error) {
            tabla.replaceChildren();
            mensaje.hidden = false;
            actualizacion.textContent = "";
            console.error("Error cargando licencias:", error);
        }
    }

    cargarLicencias();
</script>

</body>
</html>
